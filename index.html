  <style>
    :root{
      --paper:#f7f7f4;
      --ink:#080808;
      --muted:#666661;
      --line:rgba(8,8,8,.22);
      --serif:"Cormorant Garamond", Georgia, serif;
      --sans:"Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-right:env(safe-area-inset-right, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --safe-left:env(safe-area-inset-left, 0px);
    }

    *{ box-sizing:border-box; }

    html{
      min-height:100%;
      background:var(--paper);
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      margin:0;
      overflow-x:hidden;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{ color:inherit; }

    .skip-link{
      position:fixed;
      top:10px;
      left:10px;
      z-index:100;
      padding:10px 14px;
      background:var(--ink);
      color:var(--paper);
      font:600 .68rem/1 var(--mono);
      letter-spacing:.08em;
      text-decoration:none;
      text-transform:uppercase;
      transform:translateY(-180%);
    }

    .skip-link:focus{ transform:translateY(0); }

    .site-shell{
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }

    .masthead{
      min-height:88px;
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      align-items:center;
      gap:32px;
      padding:
        calc(18px + var(--safe-top))
        max(clamp(20px, 4vw, 64px), var(--safe-right))
        18px
        max(clamp(20px, 4vw, 64px), var(--safe-left));
      border-bottom:1px solid var(--ink);
    }

    .identity{
      display:inline-flex;
      align-items:center;
      gap:14px;
      width:fit-content;
      font:600 .68rem/1 var(--mono);
      letter-spacing:.1em;
      text-decoration:none;
      text-transform:uppercase;
    }

    .identity-mark{
      width:30px;
      height:30px;
      display:grid;
      place-items:center;
      border:1px solid var(--ink);
      font-size:.65rem;
      transition:background .18s ease, color .18s ease;
    }

    .identity:hover .identity-mark,
    .identity:focus-visible .identity-mark{
      background:var(--ink);
      color:var(--paper);
    }

    .main-site-link{
      min-height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:11px 14px;
      border:1px solid var(--ink);
      font:600 .64rem/1.2 var(--mono);
      letter-spacing:.08em;
      text-decoration:none;
      text-transform:uppercase;
      transition:background .18s ease, color .18s ease;
    }

    .main-site-link:hover,
    .main-site-link:focus-visible{
      background:var(--ink);
      color:var(--paper);
      outline:none;
    }

    .threshold{
      position:relative;
      min-height:clamp(560px, calc(100dvh - 176px), 920px);
      display:grid;
      grid-template-columns:minmax(34px, 1fr) minmax(0, 11fr) minmax(150px, 2fr);
      border-bottom:1px solid var(--ink);
    }

    .margin-field{
      border-right:1px solid var(--line);
      background:#deded9;
    }

    .threshold-content{
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      min-width:0;
      padding:clamp(36px, 7vw, 104px) clamp(24px, 5vw, 76px);
    }

    .kicker{
      margin:0;
      font:600 .65rem/1 var(--mono);
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    h1{
      max-width:100%;
      margin:clamp(64px, 11vh, 130px) 0 clamp(52px, 9vh, 108px);
      font-family:var(--serif);
      font-size:clamp(4.4rem, 8vw, 7.5rem);
      font-weight:600;
      line-height:.76;
      letter-spacing:-.06em;
      white-space:nowrap;
    }

    h1 span{ display:block; }

    .entry-block{
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      align-items:end;
      gap:28px;
      padding-top:16px;
      border-top:1px solid var(--ink);
    }

    .entry-block p{
      max-width:34rem;
      margin:0;
      color:var(--muted);
      font-size:clamp(.95rem, 1.3vw, 1.08rem);
      line-height:1.55;
    }

    .archive-link{
      min-width:190px;
      min-height:54px;
      display:inline-flex;
      align-items:center;
      justify-content:space-between;
      gap:32px;
      padding:14px 16px;
      border:1px solid var(--ink);
      background:var(--ink);
      color:var(--paper);
      font:600 .68rem/1 var(--mono);
      letter-spacing:.08em;
      text-decoration:none;
      text-transform:uppercase;
      transition:background .18s ease, color .18s ease;
    }

    .archive-link:hover,
    .archive-link:focus-visible{
      background:var(--paper);
      color:var(--ink);
      outline:none;
    }

    .symbol-field{
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-left:1px solid var(--ink);
      background:#deded9;
    }

    .symbol-field::before,
    .symbol-field::after{
      display:none;
    }

    .symbol{
      position:relative;
      z-index:1;
      color:var(--ink);
      font-family:var(--mono);
      font-size:clamp(3.5rem, 7vw, 7rem);
      font-weight:500;
      line-height:1;
      transform:translateY(-.04em);
    }

    .footer{
      min-height:88px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      padding:
        18px
        max(clamp(20px, 4vw, 64px), var(--safe-right))
        calc(18px + var(--safe-bottom))
        max(clamp(20px, 4vw, 64px), var(--safe-left));
      font:500 .62rem/1.4 var(--mono);
      letter-spacing:.09em;
      text-transform:uppercase;
    }

    .footer p{ margin:0; }

    @media (max-width: 820px){
      .masthead{
        grid-template-columns:1fr;
        gap:14px;
      }

      .main-site-link{ width:100%; }

      .threshold{
        min-height:auto;
        grid-template-columns:28px minmax(0, 1fr);
      }

      .threshold-content{
        min-height:670px;
      }

      .symbol-field{
        grid-column:1 / -1;
        min-height:210px;
        border-top:1px solid var(--ink);
        border-left:0;
      }

      .entry-block{
        grid-template-columns:1fr;
        align-items:stretch;
      }

      .archive-link{ width:100%; }
    }

    @media (max-width: 520px){
      .masthead{
        min-height:0;
        padding:14px 16px;
      }

      .threshold{ grid-template-columns:16px minmax(0, 1fr); }

      .threshold-content{
        min-height:590px;
        padding:32px 20px 28px;
      }

      h1{
        margin:70px 0 62px;
        font-size:clamp(2.85rem, 11.5vw, 3.9rem);
        line-height:.78;
      }

      .footer{
        align-items:flex-start;
        flex-direction:column;
        padding:20px 16px calc(20px + var(--safe-bottom));
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        scroll-behavior:auto !important;
        transition-duration:.001ms !important;
      }
    }
  </style>
</head>

        <div class="entry-block">

    </footer>
